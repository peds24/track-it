name: Iris
options:
  bundleIdPrefix: com.peds24
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  IrisCore:
    path: IrisCore
targets:
  Iris:
    type: application
    platform: iOS
    sources:
      - path: Iris
        excludes:
          - "Config/*.xcconfig"
    configFiles:
      Debug: Iris/Config/Base.xcconfig
      Release: Iris/Config/Base.xcconfig
    # Catalogue keys from Secrets.xcconfig (empty without it), read by
    # ProviderKeys.fromBundle(). xcodegen writes this plist; Xcode merges it
    # with the generated INFOPLIST_KEY_* entries.
    info:
      path: Iris/Info.plist
      properties:
        TMDB_API_KEY: $(TMDB_API_KEY)
        GOOGLE_BOOKS_API_KEY: $(GOOGLE_BOOKS_API_KEY)
        METRON_USERNAME: $(METRON_USERNAME)
        METRON_PASSWORD: $(METRON_PASSWORD)
        # I9: VisionKit barcode scanning on the Add sheet.
        NSCameraUsageDescription: Iris uses the camera to scan a book’s or comic’s barcode.
        # I12: HTTPS only, so exempt — no export-compliance question per upload.
        ITSAppUsesNonExemptEncryption: false
        # I11: the mark on white / black while the app launches.
        UILaunchScreen:
          UIImageName: LaunchMark
          UIColorName: LaunchBackground
        # I11 (spec §7): iris:// opens the app; no deep links yet.
        CFBundleURLTypes:
          - CFBundleURLName: com.peds24.iris
            CFBundleURLSchemes: [iris]
    dependencies:
      - package: IrisCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peds24.iris
        PRODUCT_NAME: Iris
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Iris
        # I11: the spectrum-iris icon (light, dark, tinted) from Resources/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
  IrisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [IrisUITests]
    dependencies:
      - target: Iris
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peds24.iris.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Iris
  IrisTests:
    type: bundle.unit-test
    platform: iOS
    sources: [IrisTests]
    dependencies:
      - target: Iris
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peds24.iris.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Iris.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Iris"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Iris:
    build:
      targets:
        Iris: all
        IrisUITests: [test]
        IrisTests: [test]
    test:
      targets:
        - IrisTests
        - IrisUITests
