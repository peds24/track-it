name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - apple/web
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify types and tests
        run: |
          npm run typecheck
          npm test -- --runInBand

      - name: Export web static build
        env:
          EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}
          EXPO_PUBLIC_METRON_USERNAME: ${{ secrets.EXPO_PUBLIC_METRON_USERNAME }}
          EXPO_PUBLIC_METRON_PASSWORD: ${{ secrets.EXPO_PUBLIC_METRON_PASSWORD }}
          EXPO_PUBLIC_GOOGLE_BOOKS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_BOOKS_API_KEY }}
        run: npx expo export --platform web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
